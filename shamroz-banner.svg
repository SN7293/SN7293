<svg width="100%" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a1f16"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9C"/>
      <stop offset="50%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#00FF9C"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="900" height="180" fill="url(#bgGrad)"/>

  <!-- faint grid lines for "techy" feel -->
  <g stroke="#00FF9C" stroke-opacity="0.08">
    <line x1="0" y1="30" x2="900" y2="30"/>
    <line x1="0" y1="90" x2="900" y2="90"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="150" y1="0" x2="150" y2="180"/>
    <line x1="450" y1="0" x2="450" y2="180"/>
    <line x1="750" y1="0" x2="750" y2="180"/>
  </g>

  <!-- blinking cursor prompt -->
  <text x="60" y="70" font-family="monospace" font-size="18" fill="#00FF9C">&gt;_</text>

  <text x="100" y="70" font-family="'Fira Code', 'Courier New', monospace" font-size="38" font-weight="700" letter-spacing="0.5" fill="url(#textGrad)">
    Shamroz Abbas
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <text x="100" y="106" font-family="'Fira Code', monospace" font-size="17" letter-spacing="0.5" fill="#c9d1d9">
    Android Developer &#183; Kotlin &#183; Java &#183; Jetpack Compose
  </text>

  <text x="100" y="136" font-family="'Fira Code', monospace" font-size="13" letter-spacing="0.3" fill="#8b949e">
    Building clean, crash-free Android experiences
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- decorative android-ish icon -->
  <g transform="translate(800,90)" fill="#00FF9C" opacity="0.85">
    <circle cx="0" cy="-18" r="22"/>
    <rect x="-22" y="-2" width="44" height="34" rx="8"/>
    <rect x="-30" y="0" width="8" height="26" rx="4"/>
    <rect x="22" y="0" width="8" height="26" rx="4"/>
    <circle cx="-8" cy="-20" r="3" fill="#0d1117"/>
    <circle cx="8" cy="-20" r="3" fill="#0d1117"/>
  </g>
</svg>
